<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudo de spritesheet</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <div class="informacoes-frame">
            <div>Quadro:
                <span id="numeroQuadro">1</span>
                /
                <span id="totalQuadros">12</span>
            </div>
            <div>Coluna:
                <span id="numeroColuna">1</span>
                |
                Linha:
                <span id="numeroLinha">1</span>
            </div>
        </div>

        <canvas id="canvas"></canvas>

        <div class="controles">
            <button id="botaoAnterior">Anterior</button>
            <button id="botaoReproduzir">Reproduzir</button>
            <button id="botaoProximo">Próximo</button>
        </div>
        
    </main>
    <script src="script.js"></script>
</body>
</html>
